<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build an LLM, in slides</title>
<link rel="canonical" href="https://hmeyy.com/llm/slides/">
<meta name="description" content="How GPT-2 picks its next word, one slide at a time. Interactive, with every sum shown.">
<meta name="author" content="Hari Meyyappan">
<link rel="icon" href="../../img/logo.png">
<style>
:root{--ink:#202B33;--ink2:#394B59;--mu:#64707A;--line:#E3E0D8;--bg:#EFEDE7;--paper:#fff;--frame:#1F2933;
 --q:#D98A0B;--qf:#FBEBC8;--qd:#8A4B12;--k:#1C8CA8;--kf:#DCEFF3;--v:#7058BE;--vf:#ECE8F7;--ok:#269D69;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--top:52px;--rail:272px;--bar:58px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code,.tk{font-family:var(--mono);font-size:.9em;background:#F1EEE7;border-radius:4px;padding:0 3px}
.tk.sp{color:var(--qd)}
/* top bar */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.top .brand{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.top .crumb{display:flex;flex-direction:column;line-height:1.15;min-width:0}.top .crumb small{color:var(--mu);font-size:11.5px}.top .crumb b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tb{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:#C9C4B8}.tb[aria-pressed="true"]{background:var(--frame);color:#fff;border-color:var(--frame)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--k);transition:width .4s}
/* outline rail */
.rail{position:fixed;top:var(--top);bottom:0;left:0;width:var(--rail);overflow:auto;background:#FAF9F6;border-right:1px solid var(--line);padding:10px 8px 40px;z-index:10;transition:transform .3s}
body.norail .rail{transform:translateX(-100%)}
.mod{margin:10px 0 4px}
.mod h3{display:flex;align-items:center;gap:8px;margin:0;padding:6px 8px;font-size:13px;font-weight:700}
.mod h3 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#E8E4DA;font-size:11.5px}
.mod.cur h3 i{background:var(--frame);color:#fff}.mod.done h3 i{background:var(--ok);color:#fff}
.mod h3 small{margin-left:auto;color:var(--mu);font-weight:500;font-size:11.5px}
.ls{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 8px 5px 18px;border-radius:7px;font-size:13px;line-height:1.3;color:var(--ink2)}
.ls:hover{background:#F0EDE6}.ls.cur{background:#fff;box-shadow:0 0 0 1.5px var(--frame) inset;color:var(--ink);font-weight:600}
.ls .ic{flex:none;width:16px;text-align:center;font-size:11px;color:var(--mu)}
.ls.seen .ic{color:var(--ok)}
.ls .kd{margin-left:auto;font-size:10.5px;color:var(--mu);font-weight:600;letter-spacing:.03em;text-transform:none}
.ls.k-try .kd{color:var(--qd)}
/* stage */
.stage{position:fixed;top:var(--top);left:var(--rail);right:0;bottom:0;display:flex;flex-direction:column;align-items:center;transition:left .3s}
body.norail .stage{left:0}
.fit{flex:1;width:100%;display:grid;place-items:center;min-height:0;position:relative}
.box{position:relative}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 34px rgba(30,30,20,.10);padding:46px 64px 40px;overflow:hidden}
.trk{position:absolute;right:64px;top:44px;display:flex;gap:4px}.trk i{font-style:normal;width:26px;height:20px;border-radius:4px;background:#EFECE5;font-size:11.5px;font-weight:700;color:#A39C8F;display:grid;place-items:center}.trk i.p{background:#DDF1E6;color:var(--ok)}.trk i.c{background:var(--frame);color:#fff}
.slide .sk{font-size:17px;font-weight:700;color:var(--qd)}
.slide h1{font-size:38px;line-height:1.16;letter-spacing:-.02em;margin:6px 0 24px;max-width:1080px}
.sbody{display:grid;grid-template-columns:1fr 390px;gap:44px;height:540px;align-items:start}
.sfig{position:relative;min-width:0;height:100%}
.sfig svg{display:block;width:100%;height:auto;overflow:visible}
.stext p{margin:0 0 16px;font-size:21px;line-height:1.4;padding-left:16px;border-left:4px solid transparent}
.stext p.old{color:#8A949C}
.stext p.now{border-left-color:var(--q)}
.stext p.later{display:none}
.stext p.now{animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
[data-b]{opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;pointer-events:none}
[data-b].on{opacity:1;transform:none;pointer-events:auto}
/* title slides */
.slide.t-title .sbody{grid-template-columns:1fr;height:auto}
.slide.t-title h1{font-size:64px;margin:4px 0 28px}
.slide.t-title .stext{max-width:900px}.slide.t-title .stext p{font-size:27px;padding-left:0;border:0}.slide.t-title .stext p.old{color:var(--ink2)}.slide.t-title .stext p:first-child{font-weight:600;color:var(--ink)}
.slide.t-title .sfig{height:auto}
.slide.t-title .num{position:absolute;right:64px;top:30px;font-size:180px;font-weight:800;color:#F2EFE8;letter-spacing:-.05em;line-height:1}
/* model slides */
.slide.t-model .sbody{grid-template-columns:1fr 360px}
.mhold{position:absolute;inset:0;border-radius:10px;background:#fff;border:1px solid var(--line)}
#mlayer{position:absolute;z-index:3;border-radius:10px;overflow:hidden;visibility:hidden;border:1px solid var(--line);background:#fff}
#mlayer iframe{width:100%;height:100%;border:0;display:block}
.mtag{position:absolute;left:12px;top:10px;z-index:2;font-size:12px;font-weight:700;color:var(--mu);background:rgba(255,255,255,.9);padding:2px 8px;border-radius:5px}
/* recap */
.recap{list-style:none;margin:0;padding:0}
.recap li{display:flex;gap:14px;font-size:24px;line-height:1.38;margin:0 0 16px}
.recap li:before{content:"✓";flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#DDF1E6;color:var(--ok);font-weight:800;font-size:17px;margin-top:1px}
.sofar{border:2px solid var(--frame);border-radius:12px;padding:14px 18px;background:#FFFDF7;margin-bottom:22px}
.sofar small{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:4px}
.sofar div{font-size:20px;line-height:1.45}.sofar .nw{background:var(--qf);border-radius:4px;padding:0 3px}
.terms small{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:8px}
.terms span{display:inline-block;margin:0 6px 8px 0;border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-size:16px;background:#fff}
.chg{border-left:5px solid var(--q);background:#FFF8EA;border-radius:0 10px 10px 0;padding:12px 16px;margin-top:18px}
.chg b{display:block;font-size:13px;color:var(--qd)}.chg div{font-size:19px;line-height:1.4}
/* widgets */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts button,.pick{border:2px solid var(--frame);background:#fff;border-radius:10px;padding:8px 18px;font-family:var(--mono);font-size:20px}
.opts button[aria-pressed="true"]{background:var(--frame);color:#fff}
.opts button.right{border-color:var(--ok);background:#DDF1E6;color:var(--ink)}.opts button.wrong{border-color:#C24;background:#FBE4E8}
.gq{font-size:46px;font-weight:700;letter-spacing:-.02em;margin:30px 0 34px}.gq .blank{display:inline-block;min-width:150px;border-bottom:4px solid var(--q);color:var(--qd);text-align:center}
.fb{font-size:22px;margin-top:22px;color:var(--ink2)}
.thesis img{display:block;width:100%;border:1px solid var(--line);border-radius:8px}
.thesis figcaption{font-size:15px;color:var(--mu);margin-top:6px}
.three{display:grid;gap:12px;margin-top:22px}
.three div{display:flex;gap:14px;align-items:baseline;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:21px}
.three div b{font-size:26px;color:var(--q)}.three div small{margin-left:auto;color:var(--mu);font-size:15px;white-space:nowrap}
.route{display:grid;gap:8px}
.route .stop{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:7px 16px;background:#fff}
.route .stop i{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--frame);color:#fff;font-weight:800;font-size:18px}
.route .stop b{font-size:21px;display:block}.route .stop span{font-size:16.5px;color:var(--mu)}
.route .stop.hi{border-color:var(--q);background:#FFF8EA}
.sl{position:relative;font-size:16px}.sl-id{position:absolute;left:0;top:0;z-index:1;background:#fff}
.sl-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.sl-cols .w{font-family:var(--mono);font-size:19px;background:#EEEAE2;border-radius:7px;text-align:center;padding:4px 0;margin-bottom:4px}
.sl-cols label{display:block;color:var(--mu);font-size:15px;margin-top:10px}.sl-cols .r{display:flex;align-items:center;gap:8px}.sl-cols input{flex:1;min-width:0;accent-color:var(--v);height:22px;cursor:grab}.sl-cols output{font-family:var(--mono);font-size:14px;width:26px;color:var(--ink2)}
.sl-hint{margin-top:12px;font-size:15px;color:var(--v);font-weight:600}.sl-live{margin-top:6px;font-size:16px;line-height:1.7}.sl-live span{display:inline-block;font-family:var(--mono);font-size:15px;background:#F3F1EC;border-radius:6px;padding:1px 8px;margin:0 6px 0 0}.sl-live span.best{background:var(--qf);box-shadow:0 0 0 2px var(--q) inset;font-weight:700}
.ctl{display:flex;align-items:center;gap:12px;font-size:17px;margin-top:10px;color:var(--v);font-weight:600}.ctl input{flex:1;max-width:300px;accent-color:var(--v);cursor:grab}.ctl b{font-family:var(--mono);color:var(--ink);min-width:40px}
.ctl-out{font-size:18px;margin-top:8px;font-family:Georgia,serif}
.dice .row{display:flex;align-items:center;gap:14px;font-size:18px;margin:6px 0 4px}
.dice input{flex:1;accent-color:var(--k)}
.dice .res{font-family:var(--mono);font-size:22px;min-height:34px;margin-top:6px}
.dice .res b{background:var(--qf);border:2px solid var(--q);border-radius:8px;padding:1px 8px}
.thesis2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.thesis2 img{width:100%;border:1px solid var(--line);border-radius:6px;display:block}.thesis2 small{font-size:14px;color:var(--mu)}
.chat{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.chat h4{margin:0 0 10px;font-size:15px;color:var(--mu)}
.bub{border-radius:14px;padding:10px 14px;font-size:19px;line-height:1.4;margin-bottom:10px;max-width:92%}
.bub.u{background:#EEF2F5;margin-left:auto}.bub.m{background:#fff;border:1.5px solid var(--line)}.bub.m.good{border-color:var(--ok);background:#F1FAF5}
.order .pool,.order .done{display:flex;flex-wrap:wrap;gap:10px;min-height:52px}
.order .done{border:2px dashed var(--line);border-radius:12px;padding:10px;margin:14px 0}
.order button{font-family:inherit;font-size:18px;border:2px solid var(--frame);background:#fff;border-radius:9px;padding:6px 14px}
.order .done button{border-color:var(--ok);background:#DDF1E6;cursor:default}
.order .shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0}
.cta{display:inline-block;margin-top:24px;background:var(--frame);color:#fff;text-decoration:none;border-radius:10px;padding:10px 20px;font-weight:700;font-size:20px}
/* player bar */
.bar{height:var(--bar);flex:none;display:flex;align-items:center;gap:10px;padding:0 6px}
.bar .nb{border:0;background:var(--frame);color:#fff;border-radius:9px;padding:7px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.bar .pb{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-weight:700;font-size:14px}
.bar .nb:disabled,.bar .pb:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#D6D1C6}.dots i.on{background:var(--v)}
.bar .cnt{font-size:13px;color:var(--mu);white-space:nowrap}
.deep{position:relative;width:100%;max-height:0;overflow:hidden;transition:max-height .35s;flex:none}
body.deep-on .deep{max-height:220px;overflow:auto}
.deep .in{margin:0 auto;padding:12px 18px;background:#fff;border-top:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink2)}
.deep .in b{color:var(--ink)}.deep p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--frame);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
/* present mode */
body.present .top,body.present .rail{display:none}body.present .stage{top:0;left:0;background:#111}body.present .bar{color:#ddd}body.present .bar .pb{background:#222;border-color:#333;color:#ddd}
/* phone: slides flow instead of scaling */
@media (max-width:760px){
 :root{--rail:0px}
 .rail{width:86vw;box-shadow:0 0 40px rgba(0,0,0,.2)}body:not(.railopen) .rail{transform:translateX(-100%)}body.railopen .rail{transform:none}
 .top .brand,.top .pres{display:none}
 .stage{left:0}.fit{display:block;overflow:auto;padding:10px}
 .box{width:auto!important;height:auto!important}
 .slide{position:relative;width:auto;height:auto;transform:none!important;padding:22px 18px 24px;border-radius:12px}
 .slide h1{font-size:25px;margin:4px 0 14px}.trk{display:none}.slide .sk{font-size:12px}
 .slide.t-title h1{font-size:38px}.slide.t-title .num{font-size:90px;right:18px;top:14px}
 .sbody,.slide.t-model .sbody{grid-template-columns:1fr;height:auto;gap:16px}
 .sfig{height:auto}.slide.t-model .sfig{height:62vw;min-height:240px}
 .stext p,.slide.t-title .stext p,.slide.t-title .stext p.old{font-size:18px}.stext p.old{font-size:15.5px}
 .sl-cols{gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}.sl-cols .w{font-size:14px}.sl-cols output{display:none}.sl-cols label{font-size:13px}.ctl{flex-wrap:wrap;font-size:15px}.ctl input{max-width:none}.recap li{font-size:18px}.sofar div{font-size:17px}.gq{font-size:30px;margin:10px 0 20px}.opts button{font-size:17px}
 .three div{font-size:17px}.route .stop b{font-size:17px}.route .stop span{font-size:14px}
 .bar{padding:0 10px;gap:8px}.bar .cnt,#autob{display:none}#deepb{padding:6px 9px}
}
</style>
</head>
<body>
<header class="top">
 <button class="tb" id="railb" aria-pressed="true">☰ Outline</button>
 <a class="brand" href="../../">Hari Meyyappan</a>
 <div class="crumb"><small id="crM">Build an LLM</small><b id="crS"></b></div>
 <div class="sp"></div>
 <a class="tb" href="../" style="text-decoration:none">3D model</a>
 <button class="tb pres" id="presb">⛶ Present</button>
 <div class="prog" id="prog"></div>
</header>
<nav class="rail" id="rail" aria-label="Outline"></nav>
<div class="stage">
 <div class="fit" id="fit"><div class="box" id="box"><div class="slide" id="slide"></div></div></div>
 <div class="deep" id="deep"><div class="in" id="deepIn"></div></div>
 <div class="bar">
  <button class="pb" id="pv" >Back</button>
  <span class="dots" id="dots"></span>
  <span class="cnt" id="cnt"></span>
  <span style="flex:1"></span>
  <button class="pb" id="deepb">Go deeper</button>
  <button class="pb" id="autob" aria-pressed="false">▶ Auto</button>
  <button class="nb" id="nx">Next</button>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const C={q:"#D98A0B",qf:"#FBEBC8",qd:"#8A4B12",k:"#1C8CA8",kf:"#DCEFF3",v:"#7058BE",vf:"#ECE8F7",ink:"#202B33",mu:"#6B7680",chip:"#EEEAE2",ok:"#269D69",line:"#E3E0D8"};
const arw=(x,y)=>`<path d="M${x} ${y} h28 m-9 -8 l9 8 l-9 8" fill="none" stroke="#8A949C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
const MONO='font-family="ui-monospace,Menlo,monospace"';
const f1=x=>(x<0?"−":"")+Math.abs(x).toFixed(1),f2=x=>(x<0?"−":"")+Math.abs(x).toFixed(2);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mixc=(a,b,t)=>{const A=hex(a),B=hex(b);return "#"+A.map((x,i)=>Math.round(x+(B[i]-x)*t).toString(16).padStart(2,"0")).join("")};
const cell=v=>{const m=Math.pow(Math.min(1,Math.abs(v)),.7);return mixc("#F5EFEA",v>=0?"#E14775":"#1C8CA8",m)};
function sp(t){return esc(t).replace(/(␣[A-Za-z]+)/g,'<span class="tk sp">$1</span>')}
function chip(x,y,t,o={}){const w=o.w||Math.max(48,t.length*10+20),h=o.h||32;
 return `<g ${o.at||""}><rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="7" fill="${o.fill||C.chip}" stroke="${o.stroke||"none"}" stroke-width="2"/><text x="${x}" y="${y+h/2+6}" text-anchor="middle" ${MONO} font-size="${o.fs||17}" fill="${o.ink||C.ink}" font-weight="${o.bold?700:400}">${esc(t)}</text></g>`}
function row12(x,y,vals,o={}){const w=o.w||14,h=o.h||22;return vals.map((v,i)=>`<rect x="${x+i*(w+2)}" y="${y}" width="${w}" height="${h}" rx="2" fill="${cell(v)}"/>`).join("")}
function arc(x0,x1,base,h,p,lab,col=C.q){const m=(x0+x1)/2;return `<path d="M${x0} ${base} Q${m} ${base-h*2} ${x1} ${base}" fill="none" stroke="${col}" stroke-width="${(1.2+p*10).toFixed(1)}" opacity="${(0.3+p*0.7).toFixed(2)}" stroke-linecap="round"/>`+(lab?`<text x="${m}" y="${base-h-10}" text-anchor="middle" font-size="17" font-weight="700" fill="${C.qd}">${lab}</text>`:"")}
function wrap(t,n){const w=t.split(" "),L=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>n){L.push(c.trim());c=x}else c+=" "+x});if(c.trim())L.push(c.trim());return L}
function card(x,y,kind,t,o={}){const c={q:[C.q,C.qf,"query"],k:[C.k,C.kf,"key"],v:[C.v,C.vf,"value"]}[kind],L=wrap(t,14),w=o.w||124;
 return `<g ${o.at||""} ${o.cls?`class="${o.cls}"`:""}><rect x="${x-w/2}" y="${y}" width="${w}" height="${34+L.length*18}" rx="8" fill="${c[1]}" stroke="${c[0]}" stroke-width="${o.hi?3:1.3}"/><text x="${x-w/2+10}" y="${y+17}" font-size="12" font-weight="700" fill="${c[0]}">${c[2]}</text>`+
 L.map((l,i)=>`<text x="${x}" y="${y+38+i*18}" text-anchor="middle" font-size="15" font-weight="${o.hi?700:400}" fill="${C.ink}">${esc(l)}</text>`).join("")+`</g>`}
/* shared story numbers */
const W5=["The","␣cat","␣sat","␣on","␣the"],THE=[.8,-.3,.5,-.9,.1,.6,-.5,.95,-.2,.3,-.7,.4];
const Q=[1.0,-0.5,0.8,0.3],K=[[-0.2,0.4,-0.1,0.2],[0.1,0.6,-0.3,0.1],[0.1,0.2,-0.1,0.3],[1.5,-0.8,1.6,0.7],[0.3,0.1,0.2,0.4]];

 {t:"Words talk",S:[

$("#deepb").onclick=()=>{document.body.classList.toggle("deep-on");setTimeout(fit,380)};
$("#presb").onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();document.body.classList.add("present")}else document.exitFullscreen()};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("present");setTimeout(fit,100)});
let auto=null;const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)};
function setAuto(on){clearInterval(auto);auto=null;$("#autob").setAttribute("aria-pressed",on);$("#autob").textContent=on?"❚❚ Pause":"▶ Auto";
 if(on)auto=setInterval(()=>{if(SL[si].kind==="try"){setAuto(false);toast("Your turn. Auto paused.");return}if(si===SL.length-1&&bi===SL[si].n-1){setAuto(false);return}next()},7000)}
$("#autob").onclick=()=>setAuto(!auto);
function onKey(k){if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k))next();else if(["ArrowLeft","ArrowUp","PageUp"].includes(k))prev();else if(k==="Home")go(0,0);else if(k==="End")go(SL.length-1,0);else if(k==="f")$("#presb").click()}
addEventListener("keydown",e=>{const tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA")return;if(e.key===" "&&tg==="BUTTON")return;if(["ArrowRight","ArrowDown","PageDown"," ","ArrowLeft","ArrowUp","PageUp","Home","End"].includes(e.key))e.preventDefault();if(auto)setAuto(false);onKey(e.key)});
addEventListener("message",e=>{if(e.data&&e.data.llm==="key"){if(auto)setAuto(false);onKey(e.data.k)}});
/* start: hash, else where you left off */
buildRail();let sv={};try{sv=JSON.parse(localStorage.getItem("llm-deck")||"{}")}catch(e){}
if(sv.seen)seen=new Set(sv.seen);if(sv.pick)state.pick=sv.pick;
{const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);if(m)go(+m[1]-1,(+m[2]||1)-1);else if(sv.si){go(sv.si,sv.bi||0);toast(`Welcome back. You were on slide ${sv.si+1} of ${SL.length}.`)}else go(0,0)}
if(innerWidth<=760){document.body.classList.remove("norail");$("#railb").setAttribute("aria-pressed","false")}
</script>
