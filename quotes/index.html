<main>
  <h1>Quotes</h1>
  <p>Lines I keep coming back to, where they come from, and the notes they turn up in.</p>

<div class="quotes">
<figure class="quote">
<blockquote>We shape our tools and thereafter our tools shape us.</blockquote>
<figcaption>John Culkin, &ldquo;A Schoolman&rsquo;s Guide to Marshall McLuhan,&rdquo; 1967. Often credited to McLuhan. In <a href="../essays/observation-is-a-tool.html">Observation Is a Tool</a>.</figcaption>
</figure>
<figure class="quote">
<blockquote>Be in the world but not of it.</blockquote>
<figcaption>A paraphrase of John 17:14&ndash;16. In <a href="../essays/free-up-the-higher-mind.html">Free Up the Higher Mind</a> and <a href="../essays/let-the-rest-play-out.html">How to Let the Rest Play Out</a>.</figcaption>
</figure>
<figure class="quote">
<blockquote>Reality is too grand to be captured by one school of thought.</blockquote>
<figcaption>Mine, November 2026.</figcaption>
</figure>
