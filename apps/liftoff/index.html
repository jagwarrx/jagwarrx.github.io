<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liftoff Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  /* layout: one phone column. The session list is home; tap a lift to zoom in, do rounds, come back. */
  --ground:#17182E; --check:#1B1D38; --panel:#23254A; --line:#3A3D6E; --dim:#6A6EA8;
  --muted:#A9ACD0; --text:#F4F1E8; --teal:#48E0C4; --orange:#FF8A4C; --shorts:#7C82D9;
  --display:'Press Start 2P',ui-monospace,monospace; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:var(--body);background:var(--ground)}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
a{color:var(--teal);text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
h1,h2,p{margin:0}
.app{--edge:max(16px,calc((100% - 430px) / 2 + 16px));height:100%;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px var(--edge) 16px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex-shrink:0}
.bottom{flex:none;position:relative;z-index:2;box-shadow:0 -10px 14px -4px rgba(23,24,46,.92)}
.pin{padding:8px var(--edge);background:var(--ground);border-top:1px solid var(--line)}
.px{font-family:var(--display)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.base{align-items:baseline}
.top a,.top button.link{min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:500;background:none;border:0;color:var(--teal);padding:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.panel{position:relative;background:var(--panel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px}
.score{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;transform-origin:left center}
.score span{font-size:10px;color:var(--muted)}
.hand{display:flex;align-items:center;gap:6px}
.chip{min-width:44px;padding:8px 6px;border-radius:4px;text-align:center;font-family:var(--display);font-size:12px;color:var(--ground)}
.bar{height:8px;background:var(--ground);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.warm i{background:linear-gradient(90deg,var(--teal),var(--orange))}
.bar.warm{animation:warm 1.6s ease-in-out infinite}
.bar.best{overflow:visible;animation:burn .5s steps(2) infinite}
.bar.best i{background:linear-gradient(90deg,var(--orange),#FFD36B)}
.flame{display:inline-block;vertical-align:-2px;margin-right:6px;shape-rendering:crispEdges;transform-origin:50% 100%;animation:flame .32s steps(2) infinite}
@keyframes warm{0%,100%{box-shadow:0 0 0 0 rgba(255,138,76,0)}50%{box-shadow:0 0 8px 1px rgba(255,138,76,.45)}}
@keyframes burn{0%{box-shadow:0 0 10px 2px rgba(255,138,76,.75),0 -3px 8px rgba(255,211,107,.5)}100%{box-shadow:0 0 14px 3px rgba(255,138,76,.55),0 -5px 10px rgba(255,211,107,.35)}}
@keyframes flame{0%{transform:scale(1,1)}100%{transform:scale(.9,1.12)}}
.streak{white-space:nowrap;flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ground);background:var(--orange);padding:4px 6px;border-radius:2px}
.popup{position:absolute;left:120px;top:20px;font-family:var(--display);font-size:14px;color:var(--orange);pointer-events:none}
.popup.go{animation:float 1s ease-out forwards}
.score .gain{font-style:normal;font-size:11px;color:var(--orange);margin-left:10px;display:inline-block}
.gain.go{animation:float 1s ease-out .25s forwards}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:6px 12px 6px 6px;display:flex;gap:12px;align-items:center}
.card.cur{border-color:var(--teal)}
.card.jig{animation:jig .5s ease-out}
.thumb{display:flex;flex-direction:column;align-items:center;background-color:var(--ground);background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);background-size:16px 16px;background-position:0 0,8px 8px;border-radius:6px;border:0;padding:0 0 5px;color:var(--teal)}
.thumb span{font-size:10px;font-weight:700;letter-spacing:.06em}
svg.fig{display:block;shape-rendering:crispEdges}
svg.fig[data-rot="1"]{touch-action:none;cursor:grab}
.card .info{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.name{white-space:nowrap;font-size:16px;font-weight:700;background:none;border:0;padding:0;text-align:left;color:var(--text);min-height:24px}
.plan{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.plan b{color:var(--text);font-weight:700}
.sets{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--dim);background:transparent;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;display:flex;align-items:center;justify-content:center}
.set.todo{color:var(--dim)}
.set.done{background:var(--line);border-color:var(--orange)}
.set.full{background:var(--orange);border-color:var(--orange);color:var(--ground)}
.set.next{border-color:var(--teal);color:var(--teal)}
.set.pop{animation:pop .5s ease-out}
.rest{box-shadow:inset 0 0 0 2px var(--teal)}
.clock{font-family:var(--display);font-size:20px;color:var(--teal);font-variant-numeric:tabular-nums}
.ghost{min-height:44px;padding:0 16px;background:transparent;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-weight:700}
.sq{width:44px;height:44px;padding:0;font-size:20px}
.big{min-height:64px;border:0;border-radius:10px;font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--ground);background:var(--teal);width:100%}
.big.orange{background:var(--orange)} .big.grey{background:var(--muted)}
.big.press{animation:press .35s ease-out}
.big.flash{animation:flick 1.2s linear infinite}
.quiet{min-height:52px;background:none;border:0;color:var(--muted);font-size:15px;font-weight:500;width:100%}
.go{background:var(--orange);color:var(--ground);border-radius:6px;padding:14px 12px;font-family:var(--display);font-size:12px;text-align:center;animation:flick 1.2s linear infinite}
.figbox{align-items:center;padding:8px;background-color:var(--ground);background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);background-size:16px 16px;background-position:0 0,8px 8px;box-shadow:inset 0 0 0 1px var(--line)}
.figbox.live{box-shadow:inset 0 0 0 2px var(--orange)}
.figbox .popup{left:auto;right:64px;top:60px;font-size:16px}
.cue{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.cue b{font-size:12px;font-weight:700;color:var(--text);background:var(--line);width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cue.on b{background:var(--teal);color:var(--ground)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wk{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.wk div{display:flex;gap:3px}
.wk i{width:16px;height:16px;border:1.5px solid var(--line);border-radius:3px}
.wk i.d{background:var(--orange);border-color:var(--orange)}
.wk i.n{background:var(--teal);border-color:var(--teal);animation:flick 1.5s linear infinite}
.line{border-top:1px solid var(--line);padding-top:10px}
.wkgrid{display:grid;gap:8px}
.wk i{width:20px;height:20px;font-style:normal;font-size:10px;font-weight:700;line-height:1;color:var(--dim);display:flex;align-items:center;justify-content:center}
.wk i.d,.wk i.n{color:var(--ground)}
.ab{width:32px;height:32px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ground);background:var(--text)}
.ab.b{background:var(--shorts);color:var(--text)}
.ab.big{width:44px;height:44px;font-size:22px}
.dock{padding:10px var(--edge) calc(12px + env(safe-area-inset-bottom,0px));background:var(--ground);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.doit{display:flex;gap:8px;align-items:stretch}
.doit .big{flex:1}
.tall{height:64px;width:52px}
.big.two{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.big.two b{font-weight:700;font-size:16px;line-height:1.3}
.dock .row{flex-wrap:wrap}
.big.two span{font-family:var(--body);font-size:12px;font-weight:700}
.wide{width:100%;min-height:52px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;border-radius:10px;background:var(--teal);color:var(--ground);text-align:left}
.cta span{display:flex;flex-direction:column;gap:6px;min-width:0}
.cta i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em}
.cta b{font-size:18px}
.cta em{font-style:normal;font-family:var(--display);font-size:18px}
.tabs{display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;max-width:144px;min-height:56px;background:none;border:0;border-top:2px solid transparent;font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tabs svg{display:block;shape-rendering:crispEdges}
.tabs button.on{color:var(--orange);border-top-color:var(--orange)}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl{min-height:52px;background:transparent;border:1.5px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.lvl b{font-size:18px;font-weight:700}
.lvl.on{background:rgba(72,224,196,.14);border-color:var(--teal);color:var(--text)}
.logrow{display:flex;gap:10px;align-items:center}
.lvls.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lvl small{font-size:11px;font-weight:500;opacity:.85}
.asks{display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:2px;height:14px}
.segs i{display:block;background:var(--line);border-radius:1px;position:relative;overflow:hidden;min-width:2px}
.segs i.r{background:#5a3a2a}
.streak.plain{background:var(--line);color:var(--text)}
.segs i u{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.segs i.r u{background:var(--orange)}
.runclock{font-family:var(--display);font-size:40px;line-height:1.2;font-variant-numeric:tabular-nums}
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{min-height:44px;font-size:12px;padding:0}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{min-width:28px;height:28px;border-radius:14px;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.pip.done{background:var(--line);border-color:var(--orange);color:var(--text)}
.pip.full{background:var(--orange);border-color:var(--orange);color:var(--ground)}
.reset{background:none;border:0;color:var(--teal);font-size:13px;font-weight:700;min-height:32px;padding:0 6px;text-decoration:underline}
.notice{border-radius:8px;padding:10px 12px;color:var(--text);background:var(--line);font-size:13px;font-weight:500;line-height:1.45;text-wrap:pretty}
.restline{height:4px;border-radius:0}
.restclock{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px!important;font-variant-numeric:tabular-nums}
.restclock small{font-size:10px;font-family:var(--body);font-weight:700;letter-spacing:.06em}
.figrow{display:flex;align-items:center;justify-content:space-between;width:100%}
.chipmeta{font-size:13px;font-weight:700;color:var(--text);background:var(--line);padding:5px 10px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lname{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname .small{font-weight:400}
h1,h2{text-wrap:balance}
h1{font-size:22px;font-weight:700;line-height:1.2}
h1.page{font-size:28px;padding-top:8px}
.wkdots{display:flex;gap:6px;padding:0 2px}
.wkdots div{flex:1;display:flex;gap:2px}
.wkdots i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.wkdots i.d{background:var(--orange)}
.wkdots i.n{background:var(--teal)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:8px 2px 0}
.sechead span{font-weight:500}
.list{padding:2px 14px;gap:0}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:8px 0;background:none;border:0;text-align:left;font-size:15px}
.lrow+.lrow,.list>.sub+.lrow{border-top:1px solid var(--line)}
.lrow .l{display:flex;align-items:center;gap:10px;min-width:0}
.lrow .t{display:flex;flex-direction:column;gap:2px;min-width:0;font-weight:700}
.lrow .t .small{font-weight:400}
.lrow .r{display:flex;align-items:center;gap:8px;flex:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.lrow .chev{color:var(--dim);font-size:18px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--line);color:var(--muted)}
.pill.on{background:rgba(72,224,196,.16);color:var(--teal)}
.sub{display:flex;flex-direction:column;gap:8px;padding:2px 0 12px}
.sheetwrap{position:fixed;inset:0;z-index:10;background:rgba(10,10,24,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:430px;background:var(--panel);border-radius:16px 16px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:rise .2s ease-out}
.sheet h2{font-size:18px}
.sheet .big{min-height:52px;font-size:15px;letter-spacing:.02em}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px)}to{transform:none}}
.small,.cue span{text-wrap:pretty}
.plan,.clock,.score,.px{font-variant-numeric:tabular-nums}
.big,.cta{box-shadow:0 3px 0 rgba(0,0,0,.35)}
.big:active,.cta:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.ghost:active,.lvl:active,.thumb:active,.tabs button:active{transform:scale(.95)}
.set:active{transform:scale(.84)}
@keyframes settle{0%{opacity:0;transform:translateY(12px) scale(.98)}60%{opacity:1;transform:translateY(-3px) scale(1.005)}100%{opacity:1;transform:none}}
.scroll.fresh>*,.scroll.fresh .card,.scroll.fresh .tally{animation:settle .34s ease-out both}
.scroll.fresh>:nth-child(2){animation-delay:.04s}.scroll.fresh>:nth-child(3){animation-delay:.08s}.scroll.fresh>:nth-child(4){animation-delay:.12s}.scroll.fresh>:nth-child(5){animation-delay:.16s}.scroll.fresh>:nth-child(n+6){animation-delay:.2s}
.scroll.fresh .card:nth-child(1){animation-delay:.08s}.scroll.fresh .card:nth-child(2){animation-delay:.14s}.scroll.fresh .card:nth-child(3){animation-delay:.2s}.scroll.fresh .card:nth-child(4){animation-delay:.26s}.scroll.fresh .card:nth-child(n+5){animation-delay:.32s}
.ghost,.set,.lvl,.big,.cta{transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .12s}
.nudge{color:var(--orange);font-weight:700;font-size:14px;animation:flick 1.2s linear infinite}
[hidden]{display:none!important}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes jig{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-1.6deg) scale(1.02)}60%{transform:rotate(1.2deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
@keyframes bump{0%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes press{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes float{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-40px) scale(1.25);opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(72,224,196,0)}50%{box-shadow:0 0 0 4px rgba(72,224,196,.35)}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.55}}
.bump{animation:bump .45s ease-out}
.shake{animation:shake .55s ease-out}
@media (prefers-reduced-motion: reduce){*,body{animation:none!important}}
</style>

<script>
(function () {
'use strict';
var LIFTS = [
  { id: 'sq', day: 'A', name: 'Dumbbell squat', sets: 5, reps: 5, inc: 5, pair: true, down: true, tags: ['STAND', 'SIT BACK', 'DEPTH'],
    cues: ['Rest one end of each dumbbell on each shoulder, elbows pointing forward. Heels shoulder width, toes turned out about 30 degrees, chest up and ribs down.', 'Take a breath and brace, then sit your hips back as your knees bend. Knees follow the line of your toes.', 'Go down until the crease of your hip is below the top of your knees, then push through the floor and squeeze your hips to stand.'],
    watch: 'Watch for: heels lifting, knees drifting inside or outside your toes, or stopping short of depth.' },
  { id: 'bp', day: 'A', name: 'Dumbbell bench', sets: 5, reps: 5, inc: 5, pair: true, down: true, tags: ['ARMS UP', 'LOWER', 'CHEST'],
    cues: ['Sit with a dumbbell on end on each thigh, kick them up to your shoulders and roll back. Press to straight arms, then set your shoulders back and down so your upper back holds a small arch.', 'Lower with your elbows about 45 degrees from your body.', 'Stop when the bottom of the dumbbells is level with your chest, then press them up and together.'],
    watch: 'Watch for: elbows flaring straight out, or losing the shoulders-back position. No bench? Do the same press lying on the floor.' },
  { id: 'row', day: 'A', name: 'Dumbbell row', sets: 3, reps: 8, inc: 5, pair: true, down: false, tags: ['HINGE', 'PULL', 'SQUEEZE'],
    cues: ['Feet shoulder width, knees soft. Hinge at the hips with a flat back until your torso is about 45 degrees to the floor, arms hanging.', 'Brace, then pull both dumbbells toward your belly button with elbows 30 to 45 degrees from your body.', 'Squeeze your shoulder blades together at the top, then lower until your arms are fully straight.'],
    watch: 'Watch for: your back rounding, standing up as you pull, or cutting the lowering short.' },
  { id: 'rdl', day: 'B', name: 'Dumbbell RDL', sets: 5, reps: 5, inc: 5, pair: true, down: true, tags: ['STAND', 'HINGE', 'STRETCH'],
    cues: ['Feet hip width, knees soft, weight in the middle of your feet. Brace, chest up, ribs down, shoulders set back.', 'Push your hips back with a flat back. Butt, back and head stay in one line; do not bend at the waist.', 'Stop when your hamstrings pull or the dumbbells are just below your knees, then squeeze your hips to come up. Do not pull with your lower back.'],
    watch: 'Watch for: a rounded back or going lower than your hamstrings allow. Range improves with practice.' },
  { id: 'ohp', day: 'B', name: 'Dumbbell OHP', sets: 3, reps: 5, inc: 5, pair: true, down: false, tags: ['SHOULDERS', 'PRESS', 'LOCK OUT'],
    cues: ['Feet hip width. Hold the dumbbells beside or just in front of your neck, weight over your forearms, elbows a little in front and tucked in.', 'Chest up, ribs down, core tight, hips tucked. Brace and press both dumbbells up.', 'Finish with arms fully straight overhead, then bring them back down.'],
    watch: 'Watch for: ribs flaring and your lower back arching as the weights go up.' },
  { id: 'lat', day: 'B', name: 'Lat pulldown', sets: 3, reps: 8, inc: 2.5, pair: false, down: false, tags: ['REACH', 'PULL', 'CHEST'],
    cues: ['Grip the bar 6 to 10 inches wider than your shoulders on each side and sit down with it. Lean back a little so your chest points up.', 'Pull your shoulder blades back and down and bring the bar down with elbows about 45 degrees.', 'Finish with the bar between your chin and upper chest, elbows drawn in toward your sides, then control it back up.'],
    watch: 'Watch for: your chest caving in, which turns it into an arm exercise. No machine? Use a band anchored overhead, or a pull-up progression.' }

      }
    }
  }
  countTick();
  cashTick();
  if (S.cur.run && S.cur.run.state === 'on') {
    var plan = runPlan(S.runIdx), rt = runElapsed();
    if (rt >= plan.total) { ACT.runfinish({ auto: 1 }); touch(); render(); return; }
    var ra = runAt(plan, rt);
    if (ui.runSeg == null) ui.runSeg = ra.i;
    if (ra.i !== ui.runSeg) { ui.runSeg = ra.i; segCue(plan.segs[ra.i][0]); touch(); if (route().v === 'session') render(); }
    var rc = document.getElementById('runclock');
    if (rc) {
      var tx = fmt(Math.ceil(ra.left));
      if (rc.textContent !== tx) {
        rc.textContent = tx;
        document.getElementById('runtotal').textContent = fmt(Math.ceil(plan.total - rt)) + ' left';
        var u = document.querySelector('u[data-seg="' + ra.i + '"]');
        if (u) u.style.width = Math.round(ra.into / plan.segs[ra.i][1] * 100) + '%';
        if (ra.left <= 3.05 && ra.left > 0.1 && plan.segs[ra.i + 1]) blip(9);
      }
    }
  }
  var target = volume(), diff = ui.count ? 0 : target - ui.shown;
  if (diff !== 0) {
    ui.shown += diff > 0 ? Math.ceil(diff / 12) : Math.floor(diff / 12);
    var sc = document.getElementById('score');
    if (sc) sc.textContent = num(ui.shown);
  }
  var r = restLeft();
  var re = document.getElementById('rest'), rb = document.getElementById('restbar'), ck = document.getElementById('clock');
  if (re) re.textContent = fmt(r);
  if (rb) rb.style.width = Math.round(r / restLen() * 100) + '%';
  var lf = S.cur.lift;
  if (ck) {
    if (lf) {
      var el = Math.floor((Date.now() - lf.start) / 1000);
      ck.textContent = fmt(el);
      var ng = document.getElementById('nudge');
      if (ng) ng.hidden = el < 300;
    } else if (r > 0) ck.textContent = fmt(r);
  }
  if (ui.wasResting && r === 0) { blip(7); render(); }
}, 50);

autoPick();
ui.shown = volume();
render();
connect();
})();
</script>
