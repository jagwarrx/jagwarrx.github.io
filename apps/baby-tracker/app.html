<style>
:root{color-scheme:light only;--brand:#0A4C9A;--red:#C41E2A;--navy:#0F2038;--link:#0A4C9A;--sheet:#FFFFFF;--ban-bg:#FBE4E6;--ban-fg:#7D1019;--toast-bg:#141B2D;--toast-fg:#FFFFFF;--bg:#EEF0F3;--card:#FFFFFF;--ink:#111827;--mut:#56607A;--line:#C9CED8;--soft:#E3E6EC;--blue:#0A4C9A;--blue-d:#083A78;--tint:#E3EDF9;--or:#C41E2A;--or-t:#FBE4E6;--or-l:#FF6B74;--navy-m:#B9C3DA;--navy-l:#4A5674}

.timer .in{max-width:480px;margin:0 auto;min-height:100%;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}

.app>header{background:var(--brand);color:#fff;margin:calc(-20px - env(safe-area-inset-top)) -16px 0;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:4px solid var(--red)}
.app>header .mut{color:#D9E6F7}
.card{border:1.5px solid var(--line)}
.hero{border-top:4px solid var(--red)}
.hero .lab{font-weight:800}

.prim{text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.trk .nm,.ev .nm{font-weight:700}
.trk{border-bottom-width:1.5px}
.seg button{font-weight:700;border-width:1.5px}
.fld input{border-width:1.5px}
.fld{text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:700}

.pill{text-transform:uppercase;letter-spacing:.04em;font-size:12px;font-weight:800}

.bell{width:44px;height:44px;margin:-6px -4px -6px -8px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.bell.on{color:var(--or)}
.tstat{margin:0;font-size:15px;line-height:1.4;color:var(--mut)}
.tstat b{color:var(--ink)}
.bgrid{display:grid;gap:8px}.bgrid.c1{grid-template-columns:1fr}.bgrid.c2{grid-template-columns:1fr 1fr}.bgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bb{min-height:58px;border:2px solid var(--blue);border-radius:8px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px;line-height:1.15;width:100%}
.bb.ghost{background:transparent;color:var(--link);border-color:var(--line);min-height:48px;font-size:13px}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;line-height:1.35;margin:0}

.dl dd{margin:0;color:var(--mut)}
.pre{overflow:auto;background:var(--bg);border:1.5px solid var(--line);padding:10px;border-radius:6px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre;margin:0}
.sheet h2{font-size:16px}

.hero.feeding{background:var(--red);border-top-color:#fff;animation:pulse 2.6s ease-in-out infinite}

.sign{display:flex;align-items:center;gap:10px;font:800 24px/1.1 Archivo,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
@keyframes pulse{0%,100%{background-color:#C41E2A}50%{background-color:#6E0E16}}
@media (prefers-reduced-motion: reduce){.hero.feeding{animation:none}}
:focus-visible{outline:3px solid var(--or-l);outline-offset:2px}
</style>

<script>
(function(){
'use strict';
var MIN=60000, DAY=86400000, OZ=29.5735;
var IC={

info:'M12 11v6M12 7.5v.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',left:'M15 6l-6 6 6 6', right:'M9 6l6 6-6 6', down:'M6 9l6 6 6-6', x:'M6 6l12 12M18 6L6 18'
};

function svg(k,sz,fill){return '<svg aria-hidden="true" width="'+(sz||20)+'" height="'+(sz||20)+'" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[k]+'"></path></svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function pad(n){return (n<10?'0':'')+n;}
function dayKey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function keyDate(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

function mergeCfg(d){var c=defCfg();d=d||{};['name','birth','units'].forEach(function(k){if(typeof d[k]==='string')c[k]=d[k];});
 if(typeof d.lastExport==='number')c.lastExport=d.lastExport;
 var sh=d.show||{};Object.keys(c.show).forEach(function(k){if(typeof sh[k]==='boolean')c.show[k]=sh[k];});
 var r=d.rem||{};Object.keys(c.rem).forEach(function(k){if(r[k]&&typeof r[k]==='object')Object.keys(c.rem[k]).forEach(function(f){if(r[k][f]!=null)c.rem[k][f]=r[k][f];});});return c;}

var S={cfg:defCfg(),days:{},older:{},timers:{},view:'home',tlDay:dayKey(Date.now()),sheet:null,timerOpen:false,sync:'connecting',ro:false};
var DB=null, chain={}, fetched={}, pending=false;
var V=document.getElementById('view'),NAV=document.getElementById('nav'),TM=document.getElementById('timer'),SH=document.getElementById('sheet'),TO=document.getElementById('toast');

/* ---------- storage ---------- */
function toast(msg,undo){toast.undo=undo||null;TO.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Undo</button>':'')+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){TO.innerHTML='';toast.undo=null;},undo?7000:3200);}
function queue(path,fn){if(!DB)return;chain[path]=(chain[path]||Promise.resolve()).then(fn).catch(function(e){if(e&&e.code==='invalid_argument')S.ro=true;toast(S.ro?'You have view-only access, so this was not saved':'Could not save. Check your connection');render();});}

function setTimer(k,val){S.timers[k]=val;var p={};p[k]=val;upsert('app/timers',p,{});}

function blank(t,s,e){return {t:t,s:s,e:e||null,del:false,L:null,R:null,side:null,ml:null,kind:null,dk:null,con:null,col:null,med:null,note:null};}
function addEvent(ev){var k=dayKey(ev.s),id=rid();putEvent(k,id,ev);return {key:k,id:id};}
function dropEvent(key,id){var d=S.days[key]||S.older[key],old=d&&d.events&&d.events[id];if(old){var g=clone(old);g.del=true;putEvent(key,id,g);}}

function dayEvents(key){var d=S.days[key]||S.older[key],out=[];if(d&&d.events)Object.keys(d.events).forEach(function(id){var e=d.events[id];if(e&&!e.del&&typeof e.s==='number')out.push({id:id,key:key,ev:e});});return out.sort(function(a,b){return b.ev.s-a.ev.s;});}
function recent(){var out=[];Object.keys(S.days).forEach(function(k){out=out.concat(dayEvents(k));});return out.sort(function(a,b){return b.ev.s-a.ev.s;});}
function lastOf(list,types){for(var i=0;i<list.length;i++)if(types.indexOf(list[i].ev.t)>=0)return list[i].ev;return null;}

/* ---------- formatting ---------- */
function vol(ml){if(ml==null||ml==='')return '';return S.cfg.units==='oz'?(ml/OZ).toFixed(1)+' oz':Math.round(ml)+' ml';}
function volIn(ml){if(ml==null)return '';return S.cfg.units==='oz'?String(+(ml/OZ).toFixed(1)):String(Math.round(ml));}
function volOut(v){var n=parseFloat(v);if(isNaN(n)||n<0)return null;return S.cfg.units==='oz'?n*OZ:n;}

function desc(ev){
 if(ev.t==='nursing')return sides(ev);
 if(ev.t==='bottle')return [vol(ev.ml),ev.kind==='formula'?'formula':ev.kind==='breast'?'breast milk':''].filter(Boolean).join(' ')||'Logged';
 if(ev.t==='diaper')return [DK[ev.dk]||'Diaper',[ev.con,ev.col].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
 if(ev.t==='sleep')return ev.e?dur(ev.e-ev.s)+' · woke '+fmtTime(ev.e):'Started';
 if(ev.t==='pumping')return [vol(ev.ml),ev.e?dur(ev.e-ev.s):''].filter(Boolean).join(' · ')||'Logged';
 if(ev.t==='medicine')return ev.med||'Logged';

}

 if(d<14)return d+(d===1?' day old':' days old');
 if(d<84){var w=Math.floor(d/7),r=d%7;return w+' weeks'+(r?', '+r+(r===1?' day':' days'):'');}
 var bd=keyDate(b),n=new Date(),m=(n.getFullYear()-bd.getFullYear())*12+n.getMonth()-bd.getMonth()-(n.getDate()<bd.getDate()?1:0);
 if(m<24)return m+' months';return Math.floor(m/12)+' years';}

function saveSheet(){
 collect();var sh=S.sheet,f=sh.f,t=sh.t;if(t==='nursing'){var tot=((parseFloat(f.Lm)||0)+(parseFloat(f.Rm)||0))*MIN;if(tot<=0){toast('Enter minutes for at least one side');return;}
  if(f.st){var tp=String(f.st).split(':'),bd=new Date(sh.id&&f.s?f.s:(sh.base||Date.now()));bd.setHours(+tp[0]||0,+tp[1]||0,0,0);f.s=bd.getTime();if(!sh.id&&f.s>Date.now()+5*MIN)f.s-=DAY;}
  else f.s=(sh.base||Date.now())-tot;}
 if(!f.s){toast('Enter a valid time');return;}
 var ev=blank(t,f.s,null);ev.note=String(f.note||'').slice(0,200)||null;
 if(t==='bottle'){ev.ml=volOut(f.ml);ev.kind=f.kind;}
 if(t==='diaper'){ev.dk=f.dk;var p=f.dk==='poo'||f.dk==='mixed';ev.con=p&&f.con||null;ev.col=p&&f.col||null;}
 if(t==='medicine')ev.med=String(f.med||'').slice(0,60)||null;
 if(t==='pumping'){var m=parseFloat(f.mins);ev.e=m>0?f.s+m*MIN:null;ev.ml=volOut(f.ml);}
 if(t==='sleep'){if(!f.e||f.e<=f.s){toast('Wake time must be after the start');return;}ev.e=f.e;}
 if(t==='nursing'){var L=(parseFloat(f.Lm)||0)*MIN,R=(parseFloat(f.Rm)||0)*MIN;if(L+R<=0){toast('Enter minutes for at least one side');return;}ev.L=L;ev.R=R;ev.e=f.s+L+R;ev.side=f.side||(L&&!R?'L':R&&!L?'R':null);}
 var key=dayKey(ev.s),id=sh.id||rid();
 if(sh.id&&sh.key!==key){var old=(S.days[sh.key]||S.older[sh.key]||{events:{}}).events[sh.id];if(old){var gone=clone(old);gone.del=true;putEvent(sh.key,sh.id,gone);}id=rid();}
 var wasNew=!sh.id,ct=sh.clear,tv=ct&&S.timers[ct]?clone(S.timers[ct]):null;
 putEvent(key,id,ev);if(sh.clear)setTimer(sh.clear,null);if(t==='nursing'&&!S.timers.nursing)S.timerOpen=false;
 S.sheet=null;renderSheet();render(true);toast(NAMES[t]+' saved',wasNew?function(){dropEvent(key,id);if(ct&&tv)setTimer(ct,tv);render(true);}:null);
}

/* ---------- import ---------- */
function parseCsv(text){var rows=[],row=[],c='',q=false,i=0,ch;text=String(text).replace(/^﻿/,'');
 for(;i<text.length;i++){ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
  else if(ch==='"')q=true;else if(ch===','){row.push(c);c='';}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(c);c='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
  else c+=ch;}
 row.push(c);if(row.length>1||row[0]!=='')rows.push(row);return rows;}
function parseWhen(v,dateCol){v=String(v||'').trim();if(!v)return null;var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/),t;
 if(m)t=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime();
 else{var tm=v.match(/^(\d{1,2}):(\d{2})/),d=String(dateCol||'').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(tm&&d)t=new Date(+d[1],+d[2]-1,+d[3],+tm[1],+tm[2]).getTime();}
 return t&&!isNaN(t)?t:null;}
function readImport(text,existing){
 var rows=parseCsv(text);if(rows.length<2)return {err:'That file has no data rows'};
 var ix={};rows[0].forEach(function(x,i){ix[String(x).trim().toLowerCase()]=i;});
 if(ix.start==null||ix.type==null)return {err:'The file needs "start" and "type" columns'};
 var out=[],bad=0,dup=0,seen={},min=Infinity,max=0;
 function g(r,k){var i=ix[k],v=i==null?'':String(r[i]==null?'':r[i]).trim();return v.charAt(0)==="'"?v.slice(1):v;}
 function num(v){var n=parseFloat(v);return isNaN(n)||n<0?null:n;}
 rows.slice(1,5001).forEach(function(r){var t=g(r,'type').toLowerCase(),s=parseWhen(g(r,'start'),g(r,'date'));
  if(!NAMES[t]||!s||s>Date.now()+DAY){bad++;return;}
  var k=t+'|'+Math.floor(s/MIN);if(existing[k]||seen[k]){dup++;return;}seen[k]=1;
  var ev=blank(t,s,parseWhen(g(r,'end'),g(r,'date')));if(ev.e&&ev.e<=s)ev.e=null;
  if(t==='nursing'){var L=num(g(r,'left_min')),R=num(g(r,'right_min')),sd=g(r,'last_side').toLowerCase();ev.L=L?L*MIN:null;ev.R=R?R*MIN:null;ev.side=sd==='left'?'L':sd==='right'?'R':null;if(!ev.e&&(ev.L||ev.R))ev.e=s+(ev.L||0)+(ev.R||0);}
  if(t==='bottle'||t==='pumping')ev.ml=num(g(r,'amount_ml'));
  if(t==='bottle'){var mk=g(r,'milk').toLowerCase();ev.kind=mk==='formula'?'formula':mk==='breast'?'breast':null;}
  if(t==='diaper'){var dk=g(r,'diaper').toLowerCase();ev.dk=DK[dk]?dk:null;ev.con=g(r,'consistency').toLowerCase().slice(0,20)||null;ev.col=(g(r,'colour')||g(r,'color')).toLowerCase().slice(0,20)||null;}
  if(t==='medicine')ev.med=g(r,'medicine').slice(0,60)||null;
  ev.note=g(r,'note').slice(0,200)||null;out.push(ev);if(s<min)min=s;if(s>max)max=s;});
 return {evs:out,bad:bad,dup:dup,min:min,max:max,over:rows.length-1>5000};}
function bulkPut(items){var by={};items.forEach(function(it){(by[it.key]=by[it.key]||{})[it.id]=it.ev;var tgt=S.days[it.key]||S.older[it.key];if(!tgt)tgt=S.days[it.key]={date:it.key,events:{}};tgt.events=tgt.events||{};tgt.events[it.id]=it.ev;});
 Object.keys(by).forEach(function(k){upsert('days/'+k,{events:by[k]},{date:k});});}
function existingKeys(){var p=DB?DB.collection('days').limit(1000).get().then(function(q){var d={};q.docs.forEach(function(x){d[x.id]=x.data();});return d;}).catch(function(){return null;}):Promise.resolve(null);
 return p.then(function(d){var m={};[d||{},S.older,S.days].forEach(function(src){Object.keys(src).forEach(function(k){var ev=(src[k]&&src[k].events)||{};Object.keys(ev).forEach(function(id){var e=ev[id];if(e&&!e.del&&typeof e.s==='number')m[e.t+'|'+Math.floor(e.s/MIN)]=1;});});});return m;});}
var FILE=document.getElementById('csvFile');
function onFile(){var f=FILE.files&&FILE.files[0];if(!f)return;if(f.size>3000000){toast('That file is too large to import');return;}
 var fr=new FileReader();fr.onerror=function(){toast('Could not read that file');};
 fr.onload=function(){existingKeys().then(function(m){var r=readImport(fr.result,m);if(r.err){toast(r.err);return;}S.sheet={t:'csvImport',f:{},res:r,name:f.name};renderSheet();});};fr.readAsText(f);}

  if(!db){S.sync='off';render();return;}
  DB=db;var slow=setTimeout(function(){if(S.sync==='connecting'){S.sync='slow';render();}},10000);
  function ok(s){if(s.metadata&&!s.metadata.fromCache){clearTimeout(slow);S.sync='ok';}}
  function err(){clearTimeout(slow);S.sync='slow';render();}
  db.doc('app/config').onSnapshot(function(s){if(s.exists)S.cfg=mergeCfg(s.data());ok(s);render();},err);
  db.doc('app/timers').onSnapshot(function(s){S.timers=s.exists?clone(s.data()):{};ok(s);render();},err);
  db.collection('days').orderBy('date','desc').limit(14).onSnapshot(function(q){var d={};q.docs.forEach(function(x){d[x.id]=clone(x.data());});S.days=d;ok(q);render();},err);
 });
})();
})();
</script>
</body>
</html>
